name: 🚀 Evaluation Service - CI e ECR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tech-challenge-evaluation-service
  IMAGE_NAME: evaluation-service

permissions:
  contents: read

jobs:
  validate:
    name: 🧪 Validar e analisar
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🐹 Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📦 Baixar dependências
        run: go mod download

      - name: 🎨 Verificar formatação
        shell: bash
        run: |
          files=$(find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 gofmt -l)

          if [ -n "$files" ]; then
            echo "Arquivos fora do padrão gofmt:"
            echo "$files"
            echo "Diferenças:"
            find . -name '*.go' -not -path './vendor/*' -print0 | xargs -0 gofmt -d
            exit 1
          fi

      - name: 🧪 Executar testes
        run: go test ./...

      - name: 🔎 Executar Go Vet
        run: go vet ./...

      - name: 🔨 Compilar aplicação
        run: go build -trimpath -ldflags="-s -w" -o /tmp/evaluation-service .

      - name: 🛡️ Analisar dependências
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false

      - name: 🐳 Criar imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔐 Analisar imagem Docker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false

  publish:
    name: 📦 Publicar no ECR
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: ☁️ Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Entrar no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🚀 Criar e publicar imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:v1.${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max